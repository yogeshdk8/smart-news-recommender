{% extends "base.html" %}


{% block title %}
Login | Smart News Recommender
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">


        <!-- Icon -->

        <div class="auth-icon">
            🔐
        </div>


        <!-- Heading -->

        <h1>
            Welcome Back
        </h1>


        <p class="auth-subtitle">
            Sign in to continue to your personalized
            news experience.
        </p>


        <!-- Login form -->

        <form
            method="POST"
            autocomplete="on"
        >


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword(
                            'password',
                            this
                        )"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- Login button -->

            <button
                type="submit"
                class="auth-button"
            >
                🔓 Sign In
            </button>


        </form>


        <!-- Register link -->

        <div class="auth-footer">

            <p>

                Don't have an account?

                <a
                    href="{{ url_for('main.register') }}"
                >
                    Create one
                </a>

            </p>

        </div>


    </div>

</div>


{% endblock %}


{% block scripts %}

<script>

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (!input) {

        return;

    }


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

        button.setAttribute(
            "title",
            "Hide password"
        );

    }

    else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

        button.setAttribute(
            "title",
            "Show password"
        );

    }

}

</script>

{% endblock %}
