{% extends "base.html" %}

{% block title %}Create Account - Smart News Recommender{% endblock %}

{% block content %}

<style>
    /* =========================================================
       REGISTER PAGE
       ========================================================= */

    .auth-page {
        min-height: calc(100vh - 90px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px 70px;
        background: #f4f7fb;
    }

    .auth-card {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        border-radius: 24px;
        padding: 42px 46px 38px;
        border: 1px solid #e5eaf0;
        box-shadow:
            0 18px 50px rgba(15, 23, 42, 0.10),
            0 4px 15px rgba(15, 23, 42, 0.05);
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .auth-header {
        text-align: center;
        margin-bottom: 34px;
    }

    .auth-icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
            135deg,
            #e8eef8,
            #dce6f4
        );
        font-size: 35px;
        box-shadow:
            0 8px 20px rgba(30, 41, 59, 0.08);
    }

    .auth-header h1 {
        margin: 0 0 10px;
        color: #172033;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.6px;
    }

    .auth-header p {
        margin: 0 auto;
        max-width: 420px;
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .form-group {
        margin-bottom: 21px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #1e293b;
        font-size: 14px;
        font-weight: 700;
    }

    .form-control {
        width: 100%;
        height: 54px;
        padding: 0 16px;
        border: 1.5px solid #d7dee8;
        border-radius: 13px;
        background: #ffffff;
        color: #172033;
        font-size: 15px;
        outline: none;
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.2s ease;
        box-sizing: border-box;
    }

    .form-control::placeholder {
        color: #94a3b8;
    }

    .form-control:hover {
        border-color: #b9c4d3;
    }

    .form-control:focus {
        border-color: #475569;
        box-shadow:
            0 0 0 4px rgba(71, 85, 105, 0.10);
        background: #ffffff;
    }

    /* =========================================================
       PASSWORD
       ========================================================= */

    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-input {
        padding-right: 58px;
    }

    .password-toggle {
        position: absolute;
        top: 50%;
        right: 7px;
        transform: translateY(-50%);

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 10px;

        background: transparent;
        color: #64748b;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            transform 0.15s ease;
    }

    .password-toggle:hover {
        background: #eef2f7;
        color: #1e293b;
    }

    .password-toggle:active {
        transform: translateY(-50%) scale(0.94);
    }

    .password-toggle:focus-visible {
        outline: 3px solid rgba(71, 85, 105, 0.18);
        outline-offset: 1px;
    }

    .password-toggle svg {
        width: 21px;
        height: 21px;
        pointer-events: none;
    }

    .eye-closed {
        display: none;
    }

    .password-toggle.showing .eye-open {
        display: none;
    }

    .password-toggle.showing .eye-closed {
        display: block;
    }

    .form-help {
        display: block;
        margin-top: 7px;
        color: #64748b;
        font-size: 12.5px;
    }

    /* =========================================================
       PASSWORD MATCH MESSAGE
       ========================================================= */

    .password-match-message {
        display: none;
        margin-top: 7px;
        font-size: 12.5px;
        font-weight: 600;
    }

    .password-match-message.match {
        display: block;
        color: #15803d;
    }

    .password-match-message.no-match {
        display: block;
        color: #dc2626;
    }

    /* =========================================================
       CREATE ACCOUNT BUTTON
       ========================================================= */

    .btn-primary-custom {
        width: 100%;
        height: 56px;

        margin-top: 8px;

        border: none;
        border-radius: 13px;

        background: linear-gradient(
            135deg,
            #172033 0%,
            #334155 100%
        );

        color: #ffffff;

        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.1px;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;

        box-shadow:
            0 10px 24px rgba(23, 32, 51, 0.20);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
    }

    .btn-primary-custom::after {
        content: "→";
        font-size: 20px;
        line-height: 1;
        transition: transform 0.2s ease;
    }

    .btn-primary-custom:hover {
        transform: translateY(-2px);
        box-shadow:
            0 15px 30px rgba(23, 32, 51, 0.26);
        filter: brightness(1.05);
    }

    .btn-primary-custom:hover::after {
        transform: translateX(4px);
    }

    .btn-primary-custom:active {
        transform: translateY(0);
        box-shadow:
            0 7px 16px rgba(23, 32, 51, 0.18);
    }

    .btn-primary-custom:focus-visible {
        outline: 3px solid rgba(71, 85, 105, 0.20);
        outline-offset: 3px;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .auth-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 21px;
        border-top: 1px solid #edf0f4;
    }

    .auth-footer p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
    }

    .auth-footer a {
        color: #1e293b;
        font-weight: 800;
        text-decoration: none;
        margin-left: 4px;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 600px) {

        .auth-page {
            padding: 25px 12px 45px;
            align-items: flex-start;
        }

        .auth-card {
            padding: 32px 24px 28px;
            border-radius: 19px;
        }

        .auth-icon {
            width: 68px;
            height: 68px;
            font-size: 30px;
            border-radius: 19px;
        }

        .auth-header h1 {
            font-size: 28px;
        }

        .auth-header p {
            font-size: 14px;
        }

        .form-control {
            height: 52px;
        }

        .btn-primary-custom {
            height: 54px;
        }
    }
</style>


<div class="auth-page">

    <div class="auth-card">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <div class="auth-header">

            <div class="auth-icon" aria-hidden="true">
                📰
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join Smart News Recommender and get personalized news.
            </p>

        </div>


        <!-- =====================================================
             REGISTRATION FORM
             ===================================================== -->

        <form
            method="POST"
            action="{{ url_for('main.register') }}"
            id="register-form"
        >

            <!-- =================================================
                 USERNAME
                 ================================================= -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- =================================================
                 EMAIL
                 ================================================= -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control password-input"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword(
                            'password',
                            'password-eye',
                            this
                        )"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <!-- OPEN EYE -->

                        <svg
                            id="password-eye"
                            class="eye-open"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6
                                   10 6 10 6-3.5 6-10 6
                                   S2 12 2 12Z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>


                        <!-- CLOSED EYE -->

                        <svg
                            class="eye-closed"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 3l18 18" />

                            <path
                                d="M10.6 10.6a2 2 0 0 0
                                   2.8 2.8"
                            />

                            <path
                                d="M9.9 4.3A10.7 10.7 0 0 1
                                   12 4c6.5 0 10 8 10 8
                                   a17.4 17.4 0 0 1-3.1 4.2"
                            />

                            <path
                                d="M6.7 6.7C3.5 8.8 2 12 2 12
                                   s3.5 8 10 8
                                   c1.5 0 2.9-.3 4.1-.8"
                            />
                        </svg>

                    </button>

                </div>

                <small class="form-help">
                    Password must contain at least 8 characters.
                </small>

            </div>


            <!-- =================================================
                 CONFIRM PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control password-input"
                        placeholder="Confirm your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword(
                            'confirm_password',
                            'confirm-password-eye',
                            this
                        )"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <!-- OPEN EYE -->

                        <svg
                            id="confirm-password-eye"
                            class="eye-open"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6
                                   10 6 10 6-3.5 6-10 6
                                   S2 12 2 12Z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>


                        <!-- CLOSED EYE -->

                        <svg
                            class="eye-closed"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 3l18 18" />

                            <path
                                d="M10.6 10.6a2 2 0 0 0
                                   2.8 2.8"
                            />

                            <path
                                d="M9.9 4.3A10.7 10.7 0 0 1
                                   12 4c6.5 0 10 8 10 8
                                   a17.4 17.4 0 0 1-3.1 4.2"
                            />

                            <path
                                d="M6.7 6.7C3.5 8.8 2 12 2 12
                                   s3.5 8 10 8
                                   c1.5 0 2.9-.3 4.1-.8"
                            />
                        </svg>

                    </button>

                </div>


                <!-- Password match status -->

                <div
                    id="password-match-message"
                    class="password-match-message"
                ></div>

            </div>


            <!-- =================================================
                 SUBMIT BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="btn-primary-custom"
            >
                Create Account
            </button>

        </form>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <div class="auth-footer">

            <p>
                Already have an account?

                <a href="{{ url_for('main.login') }}">
                    Sign in
                </a>
            </p>

        </div>

    </div>

</div>


<!-- =============================================================
     PASSWORD TOGGLE JAVASCRIPT
     ============================================================= -->

<script>
function togglePassword(inputId, eyeId, button) {

    const input = document.getElementById(inputId);

    if (!input) {
        return;
    }

    if (input.type === "password") {

        input.type = "text";

        button.classList.add("showing");

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

        button.setAttribute(
            "title",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.classList.remove("showing");

        button.setAttribute(
            "aria-label",
            "Show password"
        );

        button.setAttribute(
            "title",
            "Show password"
        );
    }
}
</script>


<!-- =============================================================
     PASSWORD MATCH CHECK
     ============================================================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const password = document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirm_password");

    const matchMessage =
        document.getElementById("password-match-message");

    if (!password || !confirmPassword || !matchMessage) {
        return;
    }

    function checkPasswords() {

        const passwordValue = password.value;

        const confirmValue = confirmPassword.value;

        if (!confirmValue) {

            matchMessage.textContent = "";

            matchMessage.className =
                "password-match-message";

            return;
        }

        if (passwordValue === confirmValue) {

            matchMessage.textContent =
                "Passwords match.";

            matchMessage.className =
                "password-match-message match";

        } else {

            matchMessage.textContent =
                "Passwords do not match.";

            matchMessage.className =
                "password-match-message no-match";
        }
    }

    password.addEventListener(
        "input",
        checkPasswords
    );

    confirmPassword.addEventListener(
        "input",
        checkPasswords
    );

});
</script>


<!-- =============================================================
     FINAL FORM VALIDATION
     ============================================================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form =
        document.getElementById("register-form");

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirm_password");

    if (!form || !password || !confirmPassword) {
        return;
    }

    form.addEventListener("submit", function (event) {

        if (password.value !== confirmPassword.value) {

            event.preventDefault();

            confirmPassword.focus();

            return;
        }

        if (password.value.length < 8) {

            event.preventDefault();

            password.focus();
        }

    });

});
</script>

{% endblock %}
