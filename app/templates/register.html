{% extends "base.html" %}

{% block title %}Create Account - Smart News Recommender{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                📰
            </div>

            <h1>Create Account</h1>

            <p>
                Join Smart News Recommender and get personalized news.
            </p>
        </div>

        <form method="POST" action="{{ url_for('main.register') }}">

            <!-- Username -->

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >
            </div>


            <!-- Email -->

            <div class="form-group">
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control password-input"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', 'password-eye')"
                        aria-label="Show password"
                    >
                        <span id="password-eye">👁️</span>
                    </button>

                </div>

                <small class="form-help">
                    Password must contain at least 8 characters.
                </small>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control password-input"
                        placeholder="Confirm your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirm_password', 'confirm-password-eye')"
                        aria-label="Show password"
                    >
                        <span id="confirm-password-eye">👁️</span>
                    </button>

                </div>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn-primary-custom"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('main.login') }}">
                    Sign in
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
